<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>CraftLink · My Skills</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- ROOT VARIABLES (matching dashboard) ----- */
        :root {
            --primary: #2a6f6f;
            --primary-light: #3d8f8f;
            --primary-dark: #1d4f4f;
            --gradient: linear-gradient(145deg, #1d4f4f, #3d9e9e);
            --bg: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.65);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --border: rgba(45, 75, 75, 0.12);
            --text-dark: #1e2b2b;
            --text-light: #3f5555;
            --text-muted: #6b8a8a;
            --danger: #c94a4a;
            --success: #2a7a5a;
            --warning: #f39c12;
            --radius: 20px;
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            --glow: 0 0 30px rgba(42, 111, 111, 0.08);
        }

        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(42, 111, 111, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(42, 111, 111, 0.03) 0%, transparent 50%);
        }

        /* ----- MAIN CONTENT (Full width, no sidebar) ----- */
        .main-content {
            width: 100%;
            max-width: 1200px;
            padding: 30px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* ----- SKILLS CONTENT ----- */
        .skills-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Add Skill Section */
        .add-skill-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .add-skill-section h3 {
            color: var(--text-dark);
            margin-bottom: 16px;
            font-size: 18px;
        }

        .add-skill-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .add-skill-form .form-group {
            flex: 1;
            min-width: 200px;
        }

        .add-skill-form input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            color: var(--text-dark);
        }

        .add-skill-form input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42, 111, 111, 0.1);
        }

        .add-skill-form .btn-add {
            padding: 12px 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .add-skill-form .btn-add:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(42, 111, 111, 0.2);
        }

        .add-skill-form .btn-add:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Skills Grid */
        .skills-grid-section {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            min-height: 200px;
        }

        .skills-grid-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .skills-grid-section .section-header h3 {
            color: var(--text-dark);
            font-size: 18px;
        }

        .skills-grid-section .section-header .skill-count {
            background: rgba(42, 111, 111, 0.1);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .skill-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s;
            position: relative;
        }

        .skill-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: rgba(42, 111, 111, 0.2);
        }

        .skill-card .skill-name {
            font-weight: 500;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .skill-card .skill-name .skill-icon {
            color: var(--primary-light);
            font-size: 18px;
        }

        .skill-card .skill-actions {
            display: flex;
            gap: 8px;
        }

        .skill-card .skill-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 14px;
            color: var(--text-muted);
        }

        .skill-card .skill-actions .btn-delete:hover {
            background: rgba(201, 74, 74, 0.1);
            color: var(--danger);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 60px;
            color: var(--primary-light);
            opacity: 0.3;
            margin-bottom: 16px;
        }

        .empty-state h4 {
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ----- MESSAGES / ALERTS ----- */
        .message-area {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .message-area.show {
            display: block;
        }

        .message-area.success {
            background: rgba(42, 122, 90, 0.08);
            color: var(--success);
            border: 1px solid rgba(42, 122, 90, 0.2);
        }

        .message-area.error {
            background: rgba(201, 74, 74, 0.08);
            color: var(--danger);
            border: 1px solid rgba(201, 74, 74, 0.2);
        }

        .message-area.info {
            background: rgba(42, 111, 111, 0.08);
            color: var(--primary);
            border: 1px solid rgba(42, 111, 111, 0.2);
        }

        /* ----- LOADING ----- */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 12px;
            color: var(--text-muted);
        }

        .loading-spinner i {
            font-size: 24px;
            color: var(--primary-light);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }


        
        /* ----- MOBILE RESPONSIVE ----- */
        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
            }

            .add-skill-form {
                flex-direction: column;
            }

            .add-skill-form .form-group {
                min-width: 100%;
            }

            .add-skill-form .btn-add {
                width: 100%;
                justify-content: center;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }


            .skills-grid-section .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

        @media (max-width: 400px) {
            .main-content {
                padding: 12px;
            }

            .skill-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .skill-card .skill-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
    </style>
</head>
<body>

        <!-- Skills Content -->
        <div class="skills-content">
            <!-- Message Area -->
            <div id="messageArea" class="message-area"></div>

            <!-- Add Skill Section -->
            <div class="add-skill-section">
                <h3><i class="fas fa-plus-circle" style="color: var(--primary-light);"></i> Add New Skill</h3>
                <form id="addSkillForm" class="add-skill-form">
                    <div class="form-group">
                        <input 
                            type="text" 
                            id="skillInput" 
                            placeholder="Enter a skill (e.g., Electrical Engineering)" 
                            required 
                            autocomplete="off"
                        />
                    </div>
                    <button type="submit" class="btn-add" id="addSkillBtn">
                        <i class="fas fa-plus"></i> Add Skill
                    </button>
                </form>
            </div>

            <!-- Skills Grid -->
            <div class="skills-grid-section">
                <div class="section-header">
                    <h3><i class="fas fa-tools" style="color: var(--primary-light);"></i> Your Skills</h3>
                    <span class="skill-count" id="skillCount">0 skills</span>
                </div>
                
                <div id="skillsContainer">
                    <!-- Skills will be rendered here -->
                    <div class="loading-spinner" id="loadingSpinner">
                        <i class="fas fa-spinner"></i>
                        <span>Loading your skills...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            "use strict";

            // ----- DOM REFERENCES -----
            const skillsContainer = document.getElementById('skillsContainer');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const messageArea = document.getElementById('messageArea');
            const skillInput = document.getElementById('skillInput');
            const addSkillForm = document.getElementById('addSkillForm');
            const addSkillBtn = document.getElementById('addSkillBtn');
            const skillCount = document.getElementById('skillCount');

            // ----- API ENDPOINTS (EXACTLY matching backend routes) -----
            const API = {
                // GET endpoint for loading skills
                getSkills: '/my_skill_set',
                // POST endpoint for adding a skill
                addSkill: '/add/skill_set',
                // POST endpoint for deleting a skill
                deleteSkill: (id) => `/delete_skillset/${id}`
            };

            // ----- STATE -----
            let skills = [];
            let isLoading = false;

            // ----- UTILITY FUNCTIONS -----
            function showMessage(message, type = 'info') {
                messageArea.textContent = message;
                messageArea.className = `message-area show ${type}`;
                clearTimeout(window.messageTimeout);
                window.messageTimeout = setTimeout(() => {
                    messageArea.classList.remove('show');
                }, 5000);
            }

            function getSkillIcon(skill) {
                const lowerSkill = skill.toLowerCase();
                if (lowerSkill.includes('electrical')) return '⚡';
                if (lowerSkill.includes('plumbing')) return '🔧';
                if (lowerSkill.includes('masonry')) return '🧱';
                if (lowerSkill.includes('carpentry')) return '🪚';
                if (lowerSkill.includes('hvac')) return '❄️';
                if (lowerSkill.includes('welding')) return '🔥';
                if (lowerSkill.includes('painting')) return '🎨';
                if (lowerSkill.includes('landscaping')) return '🌿';
                if (lowerSkill.includes('roofing')) return '🏠';
                if (lowerSkill.includes('contracting')) return '🏗️';
                return '📌';
            }

            // ----- RENDER SKILLS -----
            function renderSkills() {
                if (!skills || skills.length === 0) {
                    skillsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-tools"></i>
                            <h4>No skills added yet</h4>
                            <p>Add your first skill using the form above.</p>
                        </div>
                    `;
                    skillCount.textContent = '0 skills';
                    return;
                }

                let html = '<div class="skills-grid">';
                skills.forEach((skill, index) => {
                    const skillName = typeof skill === 'object' ? skill.skill_set : skill;
                    // Use index as fallback ID since backend doesn't return IDs in /my_skill_set
                    const skillId = skill.id || index;
                    
                    html += `
                        <div class="skill-card" data-index="${index}">
                            <div class="skill-name">
                                <span class="skill-icon">${getSkillIcon(skillName)}</span>
                                ${skillName}
                            </div>
                            <div class="skill-actions">
                                <button class="btn-delete" data-skill-id="${skillId}" data-skill-name="${skillName}" title="Delete skill">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                
                skillsContainer.innerHTML = html;
                skillCount.textContent = `${skills.length} skill${skills.length > 1 ? 's' : ''}`;

                // Attach delete events
                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const skillId = this.dataset.skillId;
                        const skillName = this.dataset.skillName || 'this skill';
                        if (skillId !== undefined && skillId !== null && skillId !== '') {
                            handleDeleteSkill(skillId, skillName);
                        } else {
                            showMessage('Unable to delete: Skill ID not found', 'error');
                        }
                    });
                });
            }

            // ----- LOAD SKILLS (GET request to /my_skill_set) -----
            async function loadSkills() {
                try {
                    isLoading = true;
                    loadingSpinner.style.display = 'flex';
                    skillsContainer.innerHTML = '';

                    // Make GET request to load skills
                    const response = await fetch(API.getSkills, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success && data.skill_set && Array.isArray(data.skill_set)) {
                        skills = data.skill_set;
                    } else {
                        skills = [];
                        if (data.msg) {
                            showMessage(data.msg, 'info');
                        }
                    }

                    renderSkills();
                } catch (error) {
                    showMessage('Failed to load skills. Please try again.', 'error');
                    skillsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                            <h4>Error loading skills</h4>
                            <p>Please refresh the page or try again later.</p>
                        </div>
                    `;
                } finally {
                    isLoading = false;
                    loadingSpinner.style.display = 'none';
                }
            }

            // ----- ADD SKILL (POST to /add/skill_set) -----
            async function handleAddSkill(e) {
                e.preventDefault();
                
                const skill = skillInput.value.trim();
                if (!skill) {
                    showMessage('Please enter a skill name.', 'error');
                    return;
                }

                // Check if skill already exists
                const skillExists = skills.some(s => {
                    const name = typeof s === 'object' ? s.skill_set : s;
                    return name.toLowerCase() === skill.toLowerCase();
                });
                
                if (skillExists) {
                    showMessage('This skill already exists in your list.', 'error');
                    skillInput.value = '';
                    return;
                }

                addSkillBtn.disabled = true;
                addSkillBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

                try {
                    // Use URLSearchParams for proper form encoding
                    const params = new URLSearchParams();
                    params.append('data', skill);

                    const response = await fetch(`${API.addSkill}?${params.toString()}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success) {
                        showMessage(data.msg || 'Skill added successfully!', 'success');
                        skillInput.value = '';
                        // Refresh skills list
                        await loadSkills();
                    } else {
                        showMessage(data.msg || 'Failed to add skill.', 'error');
                    }
                } catch (error) {
                    showMessage('An error occurred. Please try again.', 'error');
                } finally {
                    addSkillBtn.disabled = false;
                    addSkillBtn.innerHTML = '<i class="fas fa-plus"></i> Add Skill';
                }
            }

            // ----- DELETE SKILL (POST to /delete_skillset/<id>) -----
            async function handleDeleteSkill(skillId, skillName) {
                if (!confirm(`Are you sure you want to delete "${skillName}"?`)) {
                    return;
                }

                try {
                    const response = await fetch(API.deleteSkill(skillId), {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success) {
                        showMessage(data.msg || 'Skill deleted successfully!', 'success');
                        // Reload skills
                        await loadSkills();
                    } else {
                        showMessage(data.msg || 'Failed to delete skill.', 'error');
                    }
                } catch (error) {
                    showMessage('An error occurred. Please try again.', 'error');
                }
            }


            // ----- FORM SUBMIT -----
            addSkillForm.addEventListener('submit', handleAddSkill);

            // ----- INIT -----
            // Load skills when page loads
            loadSkills();

            // Handle Enter key in input
            skillInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addSkillForm.dispatchEvent(new Event('submit'));
                }
            });

        })();
    </script>

</body>
</html>
