<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>CraftLink · Not Authorised</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- ROOT (craft theme) ----- */
        :root {
            --primary: #2a6f6f;
            --primary-light: #3d8f8f;
            --gradient: linear-gradient(145deg, #1d4f4f, #3d9e9e);
            --bg: #f4f6f9;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border: rgba(45, 75, 75, 0.12);
            --text-dark: #1e2b2b;
            --text-light: #3f5555;
            --danger: #c94a4a;
            --success: #2a7a5a;
            --radius: 24px;
            --shadow: 0 12px 40px rgba(0, 20, 20, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 10% 30%, rgba(45, 130, 130, 0.04) 0%, transparent 30%),
                radial-gradient(circle at 90% 70%, rgba(30, 100, 100, 0.04) 0%, transparent 40%);
        }

        .main {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .center-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* ----- BRAND ----- */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .brand-header i {
            font-size: 34px;
            color: var(--primary);
            background: rgba(42, 111, 111, 0.10);
            padding: 10px;
            border-radius: 18px;
        }

        .brand-header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subhead {
            font-size: 15px;
            color: var(--text-light);
            margin-bottom: 24px;
            background: rgba(42, 111, 111, 0.06);
            padding: 8px 22px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(42, 111, 111, 0.08);
            font-weight: 450;
        }

        .subhead i {
            margin-right: 8px;
            color: var(--primary);
        }

        /* ----- CARD (glass) ----- */
        .card {
            width: 100%;
            padding: 48px 40px 40px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .shine {
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            animation: shineMove 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes shineMove {
            0% { left: -150%; }
            50% { left: 120%; }
            100% { left: -150%; }
        }

        /* ----- ICON ----- */
        .error-icon {
            font-size: 72px;
            color: var(--danger);
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-icon .shield {
            position: relative;
            width: 120px;
            height: 120px;
            background: rgba(201, 74, 74, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(201, 74, 74, 0.15);
        }

        .error-icon .shield i {
            font-size: 52px;
            color: var(--danger);
        }

        /* ----- TEXT ----- */
        .card h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.7;
            max-width: 380px;
            margin: 0 auto;
        }

        .card .error-code {
            display: inline-block;
            margin-top: 16px;
            padding: 6px 20px;
            background: rgba(42, 111, 111, 0.06);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .card .divider {
            width: 60px;
            height: 3px;
            background: var(--gradient);
            border-radius: 10px;
            margin: 20px auto;
        }

        .card .message-box {
            background: rgba(201, 74, 74, 0.06);
            border: 1px solid rgba(201, 74, 74, 0.12);
            border-radius: 14px;
            padding: 16px 20px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }

        .card .message-box i {
            color: var(--danger);
            font-size: 18px;
        }

        .card .message-box span {
            color: var(--text-light);
            font-size: 14px;
        }

        /* ----- STATUS INDICATOR ----- */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(201, 74, 74, 0.06);
            font-size: 13px;
            color: var(--text-muted);
        }

        .status-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 520px) {
            .card {
                padding: 32px 24px 28px;
            }

            .card h2 {
                font-size: 22px;
            }

            .card p {
                font-size: 14px;
            }

            .error-icon .shield {
                width: 96px;
                height: 96px;
            }

            .error-icon .shield i {
                font-size: 40px;
            }

            .brand-header h1 {
                font-size: 28px;
            }

            .subhead {
                font-size: 13px;
                padding: 6px 16px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 24px 16px 20px;
            }

            .card h2 {
                font-size: 19px;
            }

            .card .message-box {
                flex-direction: column;
                text-align: center;
            }

            .error-icon .shield {
                width: 80px;
                height: 80px;
            }

            .error-icon .shield i {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="center-wrap">
            <!-- Brand -->
            <div class="brand-header">
                <i class="fas fa-handshake"></i>
                <h1>CraftLink</h1>
            </div>
            <div class="subhead">
                <i class="fas fa-shield-alt"></i> Access Restricted
            </div>

            <!-- Card -->
            <div class="card">
                <div class="shine"></div>

                <!-- Icon -->
                <div class="error-icon">
                    <div class="shield">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <!-- Heading -->
                <h2>Not Authorised</h2>

                <!-- Divider -->
                <div class="divider"></div>

                <!-- Description -->
                <p>
                    You don't have permission to access this page or perform this action.
                    Please ensure you have the correct account privileges.
                </p>

                <!-- Error Code -->
                <div class="error-code">HTTP 403 · Forbidden</div>

                <!-- Message Box -->
                <div class="message-box">
                    <i class="fas fa-info-circle"></i>
                    <span>This area is restricted to authorised users only.</span>
                </div>

                <!-- Status Indicator -->
                <div class="status-indicator">
                    <span class="dot"></span>
                    Access Denied
                </div>
            </div>
        </div>
    </div>
</body>
</html>
