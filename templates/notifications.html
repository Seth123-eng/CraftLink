<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>CraftLink · Notifications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- ROOT VARIABLES (matching dashboard) ----- */
        :root {
            --primary: #2a6f6f;
            --primary-light: #3d8f8f;
            --primary-dark: #1d4f4f;
            --gradient: linear-gradient(145deg, #1d4f4f, #3d9e9e);
            --bg: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.65);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --border: rgba(45, 75, 75, 0.12);
            --text-dark: #1e2b2b;
            --text-light: #3f5555;
            --text-muted: #6b8a8a;
            --danger: #c94a4a;
            --success: #2a7a5a;
            --warning: #f39c12;
            --radius: 20px;
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            --glow: 0 0 30px rgba(42, 111, 111, 0.08);
        }

        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(42, 111, 111, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(42, 111, 111, 0.03) 0%, transparent 50%);
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            width: 100%;
            max-width: 900px;
            padding: 30px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----- BACK BUTTON ----- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: var(--primary);
            transform: translateX(-4px);
        }

        /* ----- NOTIFICATIONS HEADER ----- */
        .notifications-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .notifications-header .header-title h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notifications-header .header-title h2 i {
            color: var(--primary-light);
        }

        .notifications-header .header-title p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .notifications-header .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .notifications-header .header-actions .btn-action {
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .notifications-header .header-actions .btn-action:hover {
            background: rgba(42, 111, 111, 0.06);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .notifications-header .header-actions .btn-action.danger:hover {
            background: rgba(201, 74, 74, 0.06);
            border-color: var(--danger);
            color: var(--danger);
        }

        .notifications-header .header-actions .btn-action.primary {
            background: var(--primary);
            color: white;
            border: none;
        }

        .notifications-header .header-actions .btn-action.primary:hover {
            background: var(--primary-light);
            box-shadow: 0 8px 24px rgba(42, 111, 111, 0.2);
        }

        .notifications-header .header-actions .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ----- NOTIFICATIONS CONTAINER ----- */
        .notifications-container {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 400px;
        }

        .notifications-list {
            padding: 8px 0;
        }

        /* ----- NOTIFICATION ITEM ----- */
        .notification-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 24px;
            transition: all 0.25s;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .notification-item:last-child {
            border-bottom: none;
        }

        .notification-item:hover {
            background: rgba(42, 111, 111, 0.03);
        }

        .notification-item .notification-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(42, 111, 111, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--primary-light);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notification-item .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-item .notification-content .notification-message {
            font-size: 14px;
            color: var(--text-dark);
            line-height: 1.5;
            word-wrap: break-word;
        }

        .notification-item .notification-content .notification-link {
            display: inline-block;
            margin-top: 4px;
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .notification-item .notification-content .notification-link:hover {
            text-decoration: underline;
        }

        .notification-item .notification-content .notification-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .notification-item .notification-content .notification-time i {
            font-size: 12px;
        }

        .notification-item .notification-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .notification-item .notification-actions button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .notification-item .notification-actions .btn-delete:hover {
            background: rgba(201, 74, 74, 0.08);
            color: var(--danger);
            border-color: var(--danger);
        }

        .notification-item .notification-actions .btn-mark-read:hover {
            background: rgba(42, 111, 111, 0.08);
            color: var(--primary);
            border-color: var(--primary);
        }

        .notification-item .notification-actions .btn-mark-read:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Unread indicator */
        .notification-item.unread {
            background: rgba(42, 111, 111, 0.04);
        }

        .notification-item.unread .notification-icon {
            background: rgba(42, 111, 111, 0.15);
            color: var(--primary);
        }

        .notification-item .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .notification-item:not(.unread) .unread-dot {
            display: none;
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 60px;
            color: var(--primary-light);
            opacity: 0.3;
            margin-bottom: 16px;
        }

        .empty-state h4 {
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ----- LOADING ----- */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            gap: 12px;
            color: var(--text-muted);
        }

        .loading-spinner i {
            font-size: 28px;
            color: var(--primary-light);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----- MESSAGE AREA ----- */
        .message-area {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .message-area.show {
            display: block;
        }

        .message-area.success {
            background: rgba(42, 122, 90, 0.08);
            color: var(--success);
            border: 1px solid rgba(42, 122, 90, 0.2);
        }

        .message-area.error {
            background: rgba(201, 74, 74, 0.08);
            color: var(--danger);
            border: 1px solid rgba(201, 74, 74, 0.2);
        }

        .message-area.info {
            background: rgba(42, 111, 111, 0.08);
            color: var(--primary);
            border: 1px solid rgba(42, 111, 111, 0.2);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 1024px) {
            .main-content {
                padding: 20px;
            }

            .notifications-header .header-title h2 {
                font-size: 24px;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 16px;
            }

            .notifications-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .notifications-header .header-actions {
                width: 100%;
            }

            .notifications-header .header-actions .btn-action {
                flex: 1;
                justify-content: center;
                min-width: 80px;
            }

            .notification-item {
                padding: 14px 16px;
                flex-wrap: wrap;
            }

            .notification-item .notification-actions {
                margin-left: auto;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
            }

            .notifications-header .header-title h2 {
                font-size: 20px;
            }

            .notification-item {
                padding: 12px 14px;
                flex-direction: column;
                align-items: stretch;
            }

            .notification-item .notification-icon {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .notification-item .notification-content .notification-message {
                font-size: 13px;
            }

            .notification-item .notification-actions {
                justify-content: flex-end;
                margin-left: 52px;
            }

            .notification-item .unread-dot {
                left: 6px;
                top: 18px;
                transform: none;
            }
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
    </style>
</head>
<body>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
        <!-- Message Area -->
        <div id="messageArea" class="message-area"></div>

        <!-- Notifications Header -->
        <div class="notifications-header">
            <div class="header-title">
                <h2>
                    <i class="fas fa-bell"></i>
                    Notifications
                </h2>
                <p>Stay updated with your latest alerts</p>
            </div>
            <div class="header-actions">
                <button class="btn-action primary" onclick="markAllAsRead()" id="markAllBtn">
                    <i class="fas fa-check-double"></i> Mark All Read
                </button>
                <button class="btn-action danger" onclick="clearAllNotifications()" id="clearAllBtn">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
        </div>

        <!-- Notifications Container -->
        <div class="notifications-container">
            <div class="notifications-list" id="notificationsList">
                <div class="loading-spinner">
                    <i class="fas fa-spinner"></i>
                    <span>Loading notifications...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            "use strict";

            // ----- DOM REFERENCES -----
            const notificationsList = document.getElementById('notificationsList');
            const messageArea = document.getElementById('messageArea');
            const markAllBtn = document.getElementById('markAllBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');

            // ----- API ENDPOINTS -----
            const API = {
                fetchNotifications: '/notification/fetch',
                deleteNotification: (id) => `/notification/delete/${id}`,
                markAsRead: (id) => `/notification/mark-as-read/${id}`
            };

            // ----- STATE -----
            let notifications = [];
            let isLoading = false;

            // ----- UTILITY FUNCTIONS -----
            function showMessage(message, type = 'info') {
                if (!messageArea) return;
                messageArea.textContent = message;
                messageArea.className = `message-area show ${type}`;
                clearTimeout(window.messageTimeout);
                window.messageTimeout = setTimeout(() => {
                    messageArea.classList.remove('show');
                }, 5000);
            }

            function formatTime(dateString) {
                if (!dateString) return 'Recently';
                try {
                    const date = new Date(dateString);
                    if (isNaN(date.getTime())) return 'Recently';
                    
                    const now = new Date();
                    const diff = now - date;
                    
                    if (diff < 60 * 1000) {
                        return 'Just now';
                    } else if (diff < 60 * 60 * 1000) {
                        const mins = Math.floor(diff / (60 * 1000));
                        return `${mins} minute${mins > 1 ? 's' : ''} ago`;
                    } else if (diff < 24 * 60 * 60 * 1000) {
                        const hours = Math.floor(diff / (60 * 60 * 1000));
                        return `${hours} hour${hours > 1 ? 's' : ''} ago`;
                    } else if (diff < 7 * 24 * 60 * 60 * 1000) {
                        const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                        return `${days} day${days > 1 ? 's' : ''} ago`;
                    } else {
                        return date.toLocaleDateString('en-US', { 
                            month: 'short', 
                            day: 'numeric', 
                            year: 'numeric' 
                        });
                    }
                } catch (e) {
                    return 'Recently';
                }
            }

            function getNotificationIcon(message) {
                if (!message) return 'fa-bell';
                const lowerMsg = message.toLowerCase();
                if (lowerMsg.includes('message') || lowerMsg.includes('chat')) return 'fa-envelope';
                if (lowerMsg.includes('job') || lowerMsg.includes('posting')) return 'fa-briefcase';
                if (lowerMsg.includes('payment') || lowerMsg.includes('earn')) return 'fa-dollar-sign';
                if (lowerMsg.includes('skill') || lowerMsg.includes('craft') || lowerMsg.includes('trade')) return 'fa-tools';
                if (lowerMsg.includes('rating') || lowerMsg.includes('review') || lowerMsg.includes('star')) return 'fa-star';
                if (lowerMsg.includes('project')) return 'fa-project-diagram';
                if (lowerMsg.includes('referral')) return 'fa-user-friends';
                if (lowerMsg.includes('welcome')) return 'fa-handshake';
                return 'fa-bell';
            }

            // ----- RENDER NOTIFICATIONS -----
            function renderNotifications() {
                if (!notifications || notifications.length === 0) {
                    notificationsList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-bell-slash"></i>
                            <h4>No notifications yet</h4>
                            <p>You're all caught up! New notifications will appear here when you receive them.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                let hasUnread = false;
                
                notifications.forEach((notification) => {
                    const isUnread = notification.unread === true;
                    const iconClass = getNotificationIcon(notification.message);
                    const timeAgo = formatTime(notification.created_time);
                    const link = notification.link || '#';
                    
                    if (isUnread) hasUnread = true;
                    
                    html += `
                        <div class="notification-item ${isUnread ? 'unread' : ''}" data-id="${notification.id}">
                            ${isUnread ? '<span class="unread-dot"></span>' : ''}
                            <div class="notification-icon">
                                <i class="fas ${iconClass}"></i>
                            </div>
                            <div class="notification-content">
                                <div class="notification-message">${notification.message || 'No message content'}</div>
                                ${link && link !== '#' ? `
                                    <a href="${link}" class="notification-link" target="${link.startsWith('http') ? '_blank' : '_self'}">
                                        <i class="fas fa-arrow-right"></i> View Details
                                    </a>
                                ` : ''}
                                <div class="notification-time">
                                    <i class="far fa-clock"></i> ${timeAgo}
                                </div>
                            </div>
                            <div class="notification-actions">
                                ${isUnread ? `
                                    <button class="btn-mark-read" onclick="handleMarkAsRead('${notification.id}')" title="Mark as read">
                                        <i class="fas fa-check"></i>
                                    </button>
                                ` : ''}
                                <button class="btn-delete" onclick="handleDeleteNotification('${notification.id}')" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                notificationsList.innerHTML = html;
                
                // Update mark all button state
                if (markAllBtn) {
                    markAllBtn.disabled = !hasUnread;
                }
            }

            // ----- LOAD NOTIFICATIONS -----
            async function loadNotifications() {
                try {
                    isLoading = true;
                    notificationsList.innerHTML = `
                        <div class="loading-spinner">
                            <i class="fas fa-spinner"></i>
                            <span>Loading notifications...</span>
                        </div>
                    `;

                    const response = await fetch(API.fetchNotifications, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success && data.notifications) {
                        notifications = data.notifications;
                    } else {
                        notifications = [];
                        if (data.message) {
                            showMessage(data.message, 'info');
                        }
                    }

                    renderNotifications();
                } catch (error) {
                    showMessage('Failed to load notifications. Please try again.', 'error');
                    notificationsList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                            <h4>Error loading notifications</h4>
                            <p>Please refresh the page or try again later.</p>
                        </div>
                    `;
                } finally {
                    isLoading = false;
                }
            }

            // ----- DELETE NOTIFICATION -----
            window.handleDeleteNotification = async function(notificationId) {
                if (!notificationId) {
                    showMessage('Notification ID not found.', 'error');
                    return;
                }

                if (!confirm('Are you sure you want to delete this notification?')) {
                    return;
                }

                try {
                    const response = await fetch(API.deleteNotification(notificationId), {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success) {
                        showMessage(data.message || 'Notification deleted successfully!', 'success');
                        await loadNotifications();
                    } else {
                        showMessage(data.message || 'Failed to delete notification.', 'error');
                    }
                } catch (error) {
                    showMessage('An error occurred. Please try again.', 'error');
                }
            };

            // ----- MARK AS READ -----
            window.handleMarkAsRead = async function(notificationId) {
                if (!notificationId) {
                    showMessage('Notification ID not found.', 'error');
                    return;
                }

                try {
                    const response = await fetch(API.markAsRead(notificationId), {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'Content-Type': 'application/json'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success) {
                        showMessage(data.message || 'Notification marked as read.', 'success');
                        await loadNotifications();
                    } else {
                        showMessage(data.message || 'Failed to mark notification as read.', 'error');
                    }
                } catch (error) {
                    showMessage('An error occurred. Please try again.', 'error');
                }
            };

            // ----- MARK ALL AS READ -----
            window.markAllAsRead = async function() {
                if (!notifications || notifications.length === 0) {
                    showMessage('No notifications to mark as read.', 'info');
                    return;
                }

                const unreadNotifications = notifications.filter(n => n.unread === true);
                if (unreadNotifications.length === 0) {
                    showMessage('All notifications are already read.', 'info');
                    return;
                }

                if (!confirm(`Mark ${unreadNotifications.length} notification${unreadNotifications.length > 1 ? 's' : ''} as read?`)) {
                    return;
                }

                let successCount = 0;
                let failCount = 0;

                for (const notification of unreadNotifications) {
                    try {
                        const response = await fetch(API.markAsRead(notification.id), {
                            method: 'POST',
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest',
                                'Content-Type': 'application/json'
                            }
                        });
                        const data = await response.json();
                        if (data.success) {
                            successCount++;
                        } else {
                            failCount++;
                        }
                    } catch (error) {
                        failCount++;
                    }
                }

                if (failCount === 0) {
                    showMessage(`Successfully marked ${successCount} notification${successCount > 1 ? 's' : ''} as read.`, 'success');
                } else {
                    showMessage(`Marked ${successCount} as read, ${failCount} failed.`, 'error');
                }
                
                await loadNotifications();
            };

            // ----- CLEAR ALL NOTIFICATIONS -----
            window.clearAllNotifications = async function() {
                if (!notifications || notifications.length === 0) {
                    showMessage('No notifications to clear.', 'info');
                    return;
                }

                if (!confirm(`Are you sure you want to delete all ${notifications.length} notification${notifications.length > 1 ? 's' : ''}? This action cannot be undone.`)) {
                    return;
                }

                let successCount = 0;
                let failCount = 0;

                for (const notification of notifications) {
                    try {
                        const response = await fetch(API.deleteNotification(notification.id), {
                            method: 'GET',
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        });
                        const data = await response.json();
                        if (data.success) {
                            successCount++;
                        } else {
                            failCount++;
                        }
                    } catch (error) {
                        failCount++;
                    }
                }

                if (failCount === 0) {
                    showMessage(`Successfully cleared ${successCount} notification${successCount > 1 ? 's' : ''}.`, 'success');
                } else {
                    showMessage(`Cleared ${successCount} notification${successCount > 1 ? 's' : ''}, ${failCount} failed.`, 'error');
                }
                
                await loadNotifications();
            };

            // ----- INIT -----
            loadNotifications();

            // Refresh notifications every 60 seconds
            setInterval(loadNotifications, 60000);

        })();
    </script>

</body>
</html>
