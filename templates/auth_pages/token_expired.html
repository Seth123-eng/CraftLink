<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>CraftLink · Token Expired</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- ROOT VARIABLES (matching CraftLink) ----- */
        :root {
            --primary: #2a6f6f;
            --primary-light: #3d8f8f;
            --primary-dark: #1d4f4f;
            --gradient: linear-gradient(145deg, #1d4f4f, #3d9e9e);
            --bg: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.65);
            --border: rgba(45, 75, 75, 0.12);
            --text-dark: #1e2b2b;
            --text-light: #3f5555;
            --text-muted: #6b8a8a;
            --danger: #c94a4a;
            --success: #2a7a5a;
            --warning: #f39c12;
            --radius: 20px;
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            --glow: 0 0 30px rgba(42, 111, 111, 0.08);
        }

        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(42, 111, 111, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(42, 111, 111, 0.03) 0%, transparent 50%);
        }

        /* ----- MAIN CONTAINER ----- */
        .token-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px 32px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .token-container:hover {
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.1);
        }

        /* ----- BRAND ----- */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }

        .brand .brand-icon {
            background: rgba(42, 111, 111, 0.1);
            padding: 10px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand .brand-icon i {
            font-size: 32px;
            color: var(--primary-light);
        }

        .brand .brand-text h1 {
            font-size: 28px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .brand .brand-text span {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            display: block;
            margin-top: 2px;
        }

        /* ----- ICON ----- */
        .token-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(201, 74, 74, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            border: 2px solid rgba(201, 74, 74, 0.2);
        }

        .token-icon i {
            font-size: 36px;
            color: var(--danger);
        }

        /* ----- HEADING ----- */
        .token-heading {
            margin-bottom: 20px;
        }

        .token-heading h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .token-heading p {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.7;
            max-width: 380px;
            margin: 0 auto;
        }

        /* ----- MESSAGE AREA ----- */
        .message-area {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            margin-bottom: 20px;
        }

        .message-area.show {
            display: block;
        }

        .message-area.success {
            background: rgba(42, 122, 90, 0.08);
            color: var(--success);
            border: 1px solid rgba(42, 122, 90, 0.2);
        }

        .message-area.error {
            background: rgba(201, 74, 74, 0.08);
            color: var(--danger);
            border: 1px solid rgba(201, 74, 74, 0.2);
        }

        .message-area.info {
            background: rgba(42, 111, 111, 0.08);
            color: var(--primary);
            border: 1px solid rgba(42, 111, 111, 0.2);
        }

        .message-area .message-icon {
            margin-right: 8px;
        }

        /* ----- EMAIL INPUT (for resend) ----- */
        .resend-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .resend-section .form-group {
            margin-bottom: 16px;
        }

        .resend-section .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            display: block;
            margin-bottom: 6px;
        }

        .resend-section .form-group label i {
            color: var(--primary-light);
            margin-right: 6px;
        }

        .resend-section .form-group .input-wrapper {
            position: relative;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .resend-section .form-group .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42, 111, 111, 0.1);
        }

        .resend-section .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .resend-section .form-group .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            color: var(--text-dark);
            background: transparent;
            font-family: inherit;
        }

        .resend-section .form-group .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        /* ----- BUTTONS ----- */
        .btn-resend {
            display: block;
            width: 100%;
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            transition: all 0.25s;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-resend:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(42, 111, 111, 0.2);
        }

        .btn-resend:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-resend .btn-icon {
            margin-right: 8px;
        }

        .btn-resend .spinner {
            display: none;
            animation: spin 1s linear infinite;
        }

        .btn-resend.loading .spinner {
            display: inline-block;
        }

        .btn-resend.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----- BACK LINK ----- */
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .back-link i {
            margin-right: 6px;
        }

        /* ----- FOOTER ----- */
        .token-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .token-footer p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .token-footer p:first-child {
            margin-bottom: 6px;
        }

        .token-footer i {
            margin-right: 4px;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 520px) {
            .token-container {
                padding: 28px 20px;
            }

            .brand .brand-text h1 {
                font-size: 24px;
            }

            .token-heading h2 {
                font-size: 20px;
            }

            .token-heading p {
                font-size: 14px;
            }

            .resend-section .form-group .input-wrapper input {
                font-size: 14px;
                padding: 12px 14px 12px 40px;
            }

            .btn-resend {
                font-size: 15px;
                padding: 12px 20px;
            }

            .token-icon {
                width: 64px;
                height: 64px;
            }

            .token-icon i {
                font-size: 28px;
            }
        }

        @media (max-width: 380px) {
            .token-container {
                padding: 20px 16px;
            }

            .brand .brand-icon i {
                font-size: 24px;
            }

            .brand .brand-text h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="token-container">
        
        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">
                <i class="fas fa-handshake"></i>
            </div>
            <div class="brand-text">
                <h1>CraftLink</h1>
                <span>Professional Network</span>
            </div>
        </div>

        <!-- Icon -->
        <div class="token-icon">
            <i class="fas fa-clock"></i>
        </div>

        <!-- Heading -->
        <div class="token-heading">
            <h2>Link Expired</h2>
            <p>
                The password reset link you clicked has expired or is no longer valid.
                Don't worry, you can request a new one below.
            </p>
        </div>

        <!-- Message Area -->
        <div id="messageArea" class="message-area">
            <i class="fas fa-info-circle message-icon"></i>
            <span id="messageText">Message</span>
        </div>

        <!-- Resend Section -->
        <div class="resend-section">
            <form id="resendForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            id="emailInput" 
                            name="email"
                            placeholder="Enter your email address" 
                            required
                            autocomplete="email"
                        />
                    </div>
                </div>

                <button type="submit" class="btn-resend" id="resendBtn">
                    <i class="fas fa-spinner spinner"></i>
                    <i class="fas fa-paper-plane btn-icon"></i>
                    <span class="btn-text">Resend Reset Link</span>
                </button>
            </form>

            <a href="{{ url_for('timezone_bp.sign_up_page') }}" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Sign In
            </a>
        </div>

        <!-- Footer -->
        <div class="token-footer">
            <p><i class="fas fa-shield-alt"></i> Your security is our priority</p>
            <p>&copy; 2026 CraftLink. All rights reserved.</p>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            "use strict";

            // ----- DOM REFERENCES -----
            const form = document.getElementById('resendForm');
            const emailInput = document.getElementById('emailInput');
            const resendBtn = document.getElementById('resendBtn');
            const messageArea = document.getElementById('messageArea');
            const messageText = document.getElementById('messageText');

            // ----- API ENDPOINT -----
            const API = {
                sendResetLink: '/send-reset/password-email'
            };

            // ----- UTILITY FUNCTIONS -----
            function showMessage(message, type = 'info') {
                if (!messageArea || !messageText) return;
                
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    info: 'fa-info-circle'
                };
                
                messageText.textContent = message;
                messageArea.className = `message-area show ${type}`;
                
                // Update icon
                const icon = messageArea.querySelector('.message-icon');
                if (icon) {
                    icon.className = `message-icon fas ${icons[type] || icons.info}`;
                }
                
                clearTimeout(window.messageTimeout);
                window.messageTimeout = setTimeout(() => {
                    messageArea.classList.remove('show');
                }, 6000);
            }

            function setLoading(isLoading) {
                if (!resendBtn) return;
                if (isLoading) {
                    resendBtn.classList.add('loading');
                    resendBtn.disabled = true;
                } else {
                    resendBtn.classList.remove('loading');
                    resendBtn.disabled = false;
                }
            }

            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            // ----- FORM SUBMIT -----
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                
                // Validate email
                if (!email) {
                    showMessage('Please enter your email address.', 'error');
                    emailInput.focus();
                    return;
                }
                
                if (!validateEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    emailInput.focus();
                    return;
                }

                // Show loading state
                setLoading(true);
                messageArea.classList.remove('show');

                try {
                    // Send request
                    const formData = new FormData();
                    formData.append('email', email);

                    const response = await fetch(API.sendResetLink, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    // Handle redirect if present
                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    // Handle response
                    if (data.success) {
                        showMessage(data.msg || 'Password reset link sent to your email!', 'success');
                        emailInput.value = '';
                        emailInput.focus();
                        
                        // Optionally, redirect after success
                        setTimeout(() => {
                            window.location.href = "{{ url_for('timezone_bp.sign_up_page') }}";
                        }, 3000);
                    } else {
                        showMessage(data.msg || data.message || 'Failed to send reset link. Please try again.', 'error');
                    }

                } catch (error) {
                    showMessage('An error occurred. Please try again.', 'error');
                } finally {
                    setLoading(false);
                }
            });

            // ----- AUTO-FOCUS -----
            emailInput.focus();

            // ----- KEYBOARD SHORTCUT: Enter to submit -----
            emailInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            });


        })();
    </script>

</body>
</html>
