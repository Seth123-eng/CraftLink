{% extends 'base.html' %}

{% block head %}
    {{ super() }}
    <title>CraftLink</title>

    <style>
        :root {
            --primary: #4b6bff;
            --gradient: linear-gradient(135deg, #4b6bff, #3ad6ff);
            --bg: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.65);
            --border: rgba(255, 255, 255, 0.35);
            --text-dark: #1f1f1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .splash-wrapper {
            text-align: center;
            animation: fadeIn 1s ease forwards;
        }

        .logo-card {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: float 4s ease-in-out infinite;
        }

        .logo-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .tagline {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }

        /* Fallback for browsers without backdrop-filter */
        @supports not (backdrop-filter: blur(14px)) {
            .logo-card {
                background: rgba(255,255,255,0.95);
            }
        }

    </style>
{% endblock %}

{% block content %}
    <div class="page-center">
        <div class="logo-card">
            <h2> CraftLink </h2>
        </div>
    </div>

<script>
    setTimeout(function() {
        window.location.href="{{ url_for('timezone_bp.sign_up_page') }}";
    }, 5000);


    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    fetch("/get/user/timezone", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ timezone })
    });


</script>
{% endblock %}
