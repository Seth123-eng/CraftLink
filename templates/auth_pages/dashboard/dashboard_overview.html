<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>CraftLink · Dashboard Overview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- ROOT VARIABLES (matching dashboard) ----- */
        :root {
            --primary: #2a6f6f;
            --primary-light: #3d8f8f;
            --primary-dark: #1d4f4f;
            --gradient: linear-gradient(145deg, #1d4f4f, #3d9e9e);
            --bg: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.65);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --border: rgba(45, 75, 75, 0.12);
            --text-dark: #1e2b2b;
            --text-light: #3f5555;
            --text-muted: #6b8a8a;
            --danger: #c94a4a;
            --success: #2a7a5a;
            --warning: #f39c12;
            --radius: 20px;
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            --glow: 0 0 30px rgba(42, 111, 111, 0.08);
        }

        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(42, 111, 111, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(42, 111, 111, 0.03) 0%, transparent 50%);
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            width: 100%;
            max-width: 1200px;
            padding: 30px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

       
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: var(--primary);
            transform: translateX(-4px);
        }

        /* ----- STATS GRID ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            border-color: rgba(42, 111, 111, 0.2);
        }

        .stat-card .stat-icon {
            font-size: 28px;
            color: var(--primary-light);
            margin-bottom: 10px;
        }

        .stat-card .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-dark);
        }

        .stat-card .stat-number.loading {
            font-size: 24px;
            color: var(--text-muted);
        }

        .stat-card .stat-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .stat-card .stat-change {
            font-size: 12px;
            margin-top: 8px;
            color: var(--success);
        }

        .stat-card .stat-change.negative {
            color: var(--danger);
        }

        /* ----- QUICK ACTIONS ----- */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        /* ----- ACTIVITY SECTION ----- */
        .activity-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            flex: 1;
        }

        .activity-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .activity-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .activity-card .card-header h3 {
            font-size: 16px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-card .card-header .view-all {
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .activity-card .card-header .view-all:hover {
            text-decoration: underline;
        }


        .activity-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
        }

        .activity-item:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .activity-item .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .activity-item .activity-icon.blue {
            background: rgba(42, 111, 111, 0.1);
            color: var(--primary);
        }

        .activity-item .activity-icon.green {
            background: rgba(42, 122, 90, 0.1);
            color: var(--success);
        }

        .activity-item .activity-icon.orange {
            background: rgba(243, 156, 18, 0.1);
            color: var(--warning);
        }

        .activity-item .activity-icon.red {
            background: rgba(201, 74, 74, 0.1);
            color: var(--danger);
        }

        .activity-item .activity-content {
            flex: 1;
        }

        .activity-item .activity-content .activity-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .activity-item .activity-content .activity-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .activity-item .activity-time {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* ----- SKILLS TAGS ----- */
        .skills-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .skill-tag {
            background: rgba(42, 111, 111, 0.08);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 40px;
            color: var(--primary-light);
            opacity: 0.3;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ----- LOADING ----- */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 12px;
            color: var(--text-muted);
        }

        .loading-spinner i {
            font-size: 24px;
            color: var(--primary-light);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----- MESSAGE AREA ----- */
        .message-area {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .message-area.show {
            display: block;
        }

        .message-area.success {
            background: rgba(42, 122, 90, 0.08);
            color: var(--success);
            border: 1px solid rgba(42, 122, 90, 0.2);
        }

        .message-area.error {
            background: rgba(201, 74, 74, 0.08);
            color: var(--danger);
            border: 1px solid rgba(201, 74, 74, 0.2);
        }

        .message-area.info {
            background: rgba(42, 111, 111, 0.08);
            color: var(--primary);
            border: 1px solid rgba(42, 111, 111, 0.2);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 1024px) {
            .main-content {
                padding: 20px;
            }


            .activity-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .stat-card {
                padding: 16px;
            }

            .stat-card .stat-number {
                font-size: 24px;
            }

            .quick-actions {
                grid-template-columns: 1fr 1fr;
            }

            .activity-item {
                flex-wrap: wrap;
            }

            .activity-item .activity-time {
                width: 100%;
                text-align: left;
                padding-left: 54px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .stat-card .stat-number {
                font-size: 20px;
            }
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
    </style>
</head>
<body>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

        <!-- Message Area -->
        <div id="messageArea" class="message-area"></div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid">
            <!-- Total Payments -->
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div>
                <div class="stat-number" id="totalPayments">KSH0.00</div>
                {% if current_user.account_type == "client" %}
                    <div class="stat-label">Total Payments made</div>
                {% else %}
                    <div class="stat-label">Total Payments Received</div>
                {% endif %}
                <div class="stat-change" id="paymentChange"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
            </div>


            <!-- Rating -->
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-star"></i></div>
                <div class="stat-number" id="avgRating">0.0</div>
                <div class="stat-label">Average Rating</div>
                <div class="stat-change" id="ratingChange"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
            </div>
        </div>
        
        {% if current_user_.account_type == "technician" %}
            <!-- Activity Section -->
            <div class="activity-section">
                <!-- Your Skills -->
                <div class="activity-card">
                    <div class="card-header">
                        <h3><i class="fas fa-tools" style="color: var(--primary-light);"></i> Your Skill Set</h3>
                        <a href="{{ url_for('skill_set_bp.skill_set_page') }}" class="view-all" target="contentFrame">Manage</a>
                    </div>
                    <div class="skills-tags" id="skillsContainer">
                        <div class="loading-spinner" style="padding: 20px;">
                            <i class="fas fa-spinner"></i>
                            <span>Loading skills...</span>
                        </div>
                    </div>
                </div>
            </div>
        {% endif %}
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            "use strict";

            // ----- DOM REFERENCES -----
            const messageArea = document.getElementById('messageArea');
            const totalPayments = document.getElementById('totalPayments');
            const totalProjects = document.getElementById('totalProjects');
            const unreadMessages = document.getElementById('unreadMessages');
            const avgRating = document.getElementById('avgRating');
            const paymentChange = document.getElementById('paymentChange');
            const messageChange = document.getElementById('messageChange');
            const ratingChange = document.getElementById('ratingChange');
            const skillsContainer = document.getElementById('skillsContainer');

            // ----- API ENDPOINTS -----
            const API = {
                totalPayments: '/dashboard/total-payments',
                getSkills: '/my_skill_set'
            };

            // ----- UTILITY FUNCTIONS -----
            function showMessage(message, type = 'info') {
                messageArea.textContent = message;
                messageArea.className = `message-area show ${type}`;
                clearTimeout(window.messageTimeout);
                window.messageTimeout = setTimeout(() => {
                    messageArea.classList.remove('show');
                }, 5000);
            }

            function formatCurrency(amount) {
                return 'KSH' + parseFloat(amount).toFixed(2);
            }

            function getSkillIcon(skill) {
                const lowerSkill = skill.toLowerCase();
                if (lowerSkill.includes('electrical')) return '⚡';
                if (lowerSkill.includes('plumbing')) return '🔧';
                if (lowerSkill.includes('masonry')) return '🧱';
                if (lowerSkill.includes('carpentry')) return '🪚';
                if (lowerSkill.includes('hvac')) return '❄️';
                if (lowerSkill.includes('welding')) return '🔥';
                if (lowerSkill.includes('painting')) return '🎨';
                if (lowerSkill.includes('landscaping')) return '🌿';
                if (lowerSkill.includes('roofing')) return '🏠';
                if (lowerSkill.includes('contracting')) return '🏗️';
                return '📌';
            }

            // ----- LOAD TOTAL PAYMENTS -----
            async function loadTotalPayments() {
                try {
                    const response = await fetch(API.totalPayments, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success) {
                        totalPayments.textContent = formatCurrency(data.total_received);
                        paymentChange.innerHTML = '<i class="fas fa-arrow-up"></i> Total earnings to date';
                        paymentChange.className = 'stat-change';
                    } else {
                        totalPayments.textContent = 'KSH0.00';
                        paymentChange.textContent = data.total_received || 'No payments yet';
                        paymentChange.className = 'stat-change';
                    }
                } catch (error) {
                    totalPayments.textContent = 'KSH0.00';
                    paymentChange.textContent = 'Error loading data';
                    paymentChange.className = 'stat-change negative';
                }
            }

            // ----- LOAD SKILLS -----
            async function loadSkills() {
                try {
                    const response = await fetch(API.getSkills, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success && data.skill_set) {
                        const skills = data.skill_set;
                        if (skills.length === 0) {
                            skillsContainer.innerHTML = `
                                <div class="empty-state" style="padding: 20px;">
                                    <i class="fas fa-tools"></i>
                                    <p>No skills added yet</p>
                                </div>
                            `;
                            return;
                        }

                        let html = '';
                        skills.forEach(skill => {
                            const skillName = skill.skill_set || skill;
                            html += `
                                <span class="skill-tag">${getSkillIcon(skillName)} ${skillName}</span>
                            `;
                        });
                        skillsContainer.innerHTML = html;
                    } else {
                        skillsContainer.innerHTML = `
                            <div class="empty-state" style="padding: 20px;">
                                <i class="fas fa-tools"></i>
                                <p>No skills found</p>
                            </div>
                        `;
                    }
                } catch (error) {
                    skillsContainer.innerHTML = `
                        <div class="empty-state" style="padding: 20px;">
                            <i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i>
                            <p>Error loading skills</p>
                        </div>
                    `;
                }
            }

            // ----- LOAD RECENT ACTIVITY -----
            function loadRecentActivity() {
                // Simulated activity data - replace with actual API call when available
                const activities = [
                    {
                        icon: 'fa-briefcase',
                        color: 'blue',
                        title: 'New project started',
                        desc: 'Electrical Upgrade project is now in progress',
                        time: '2 hours ago'
                    },
                    {
                        icon: 'fa-comment',
                        color: 'green',
                        title: 'New message received',
                        desc: 'Sarah Chen sent you a message',
                        time: '4 hours ago'
                    },
                    {
                        icon: 'fa-star',
                        color: 'orange',
                        title: 'New rating received',
                        desc: 'You received a 5-star rating',
                        time: '1 day ago'
                    },
                    {
                        icon: 'fa-dollar-sign',
                        color: 'green',
                        title: 'Payment received',
                        desc: 'KSH350.00 received for Plumbing Repair',
                        time: '2 days ago'
                    }
                ];

                
            }

            // ----- LOAD STATS (Simulated) -----
            function loadStats() {
                // Simulated stats - replace with actual API calls
                totalProjects.textContent = '12';
                
                // Simulate unread messages count (you can replace with actual API)
                unreadMessages.textContent = '3';
                messageChange.innerHTML = '<i class="fas fa-arrow-up"></i> 2 new since yesterday';
                messageChange.className = 'stat-change';

                // Simulate rating
                avgRating.textContent = '4.8';
                ratingChange.innerHTML = '<i class="fas fa-arrow-up"></i> Based on 24 reviews';
                ratingChange.className = 'stat-change';
            }

            // ----- INIT -----
            function init() {
                loadTotalPayments();
                loadSkills();
                loadRecentActivity();
                loadStats();
            }

            // Start the dashboard
            init();

        })();
    </script>

</body>
</html>
