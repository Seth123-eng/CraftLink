<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>CraftLink · Referrals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- ROOT VARIABLES (matching CraftLink) ----- */
        :root {
            --primary: #2a6f6f;
            --primary-light: #3d8f8f;
            --primary-dark: #1d4f4f;
            --gradient: linear-gradient(145deg, #1d4f4f, #3d9e9e);
            --bg: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.65);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --border: rgba(45, 75, 75, 0.12);
            --text-dark: #1e2b2b;
            --text-light: #3f5555;
            --text-muted: #6b8a8a;
            --danger: #c94a4a;
            --success: #2a7a5a;
            --warning: #f39c12;
            --radius: 20px;
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            --glow: 0 0 30px rgba(42, 111, 111, 0.08);
        }

        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(42, 111, 111, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(42, 111, 111, 0.03) 0%, transparent 50%);
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            width: 100%;
            max-width: 900px;
            padding: 30px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: var(--primary);
            transform: translateX(-4px);
        }

        /* ----- HEADER ----- */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header .title-section h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header .title-section h2 i {
            color: var(--primary-light);
            font-size: 26px;
        }

        .page-header .title-section p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* ----- STATS GRID ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: all 0.3s;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            border-color: rgba(42, 111, 111, 0.2);
        }

        .stat-card .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .stat-card .stat-icon {
            font-size: 28px;
            color: var(--primary-light);
            opacity: 0.8;
        }

        .stat-card .stat-number {
            font-size: 34px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .stat-card .stat-label {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .stat-card .stat-shine {
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(42, 111, 111, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ----- REFERRAL LINK SECTION ----- */
        .referral-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .referral-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .referral-section .section-header h3 {
            font-size: 18px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .referral-section .section-header h3 i {
            color: var(--primary-light);
        }

        .referral-link-box {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px 6px 6px 16px;
            transition: all 0.2s;
        }

        .referral-link-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42, 111, 111, 0.1);
        }

        .referral-link-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            padding: 10px 0;
            font-family: inherit;
            min-width: 150px;
        }

        .referral-link-box input::selection {
            background: rgba(42, 111, 111, 0.2);
        }

        .referral-link-box .btn-copy {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .referral-link-box .btn-copy:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(42, 111, 111, 0.2);
        }

        .referral-link-box .btn-copy.copied {
            background: var(--success);
        }

        /* ----- SEND EMAIL SECTION ----- */
        .send-email-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .send-email-section .form-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .send-email-section .form-row .input-wrapper {
            flex: 1;
            position: relative;
            min-width: 200px;
        }

        .send-email-section .form-row .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .send-email-section .form-row .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            color: var(--text-dark);
            font-family: inherit;
        }

        .send-email-section .form-row .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42, 111, 111, 0.1);
        }

        .send-email-section .form-row .btn-send {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .send-email-section .form-row .btn-send:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(42, 111, 111, 0.2);
        }

        .send-email-section .form-row .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .send-email-section .form-row .btn-send .spinner {
            display: none;
            animation: spin 1s linear infinite;
        }

        .send-email-section .form-row .btn-send.loading .spinner {
            display: inline-block;
        }

        .send-email-section .form-row .btn-send.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----- SHARE BUTTONS ----- */
        .share-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .share-buttons .btn-share {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .share-buttons .btn-share:hover {
            background: rgba(42, 111, 111, 0.06);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .share-buttons .btn-share.whatsapp {
            color: #25D366;
        }

        .share-buttons .btn-share.whatsapp:hover {
            background: rgba(37, 211, 102, 0.08);
            border-color: #25D366;
        }

        .share-buttons .btn-share.twitter {
            color: #1DA1F2;
        }

        .share-buttons .btn-share.twitter:hover {
            background: rgba(29, 161, 242, 0.08);
            border-color: #1DA1F2;
        }

        .share-buttons .btn-share.linkedin {
            color: #0A66C2;
        }

        .share-buttons .btn-share.linkedin:hover {
            background: rgba(10, 102, 194, 0.08);
            border-color: #0A66C2;
        }

        .share-buttons .btn-share.facebook {
            color: #1877F2;
        }

        .share-buttons .btn-share.facebook:hover {
            background: rgba(24, 119, 242, 0.08);
            border-color: #1877F2;
        }

        /* ----- MESSAGE AREA ----- */
        .message-area {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .message-area.show {
            display: block;
        }

        .message-area.success {
            background: rgba(42, 122, 90, 0.08);
            color: var(--success);
            border: 1px solid rgba(42, 122, 90, 0.2);
        }

        .message-area.error {
            background: rgba(201, 74, 74, 0.08);
            color: var(--danger);
            border: 1px solid rgba(201, 74, 74, 0.2);
        }

        .message-area.info {
            background: rgba(42, 111, 111, 0.08);
            color: var(--primary);
            border: 1px solid rgba(42, 111, 111, 0.2);
        }

        /* ----- REFERRALS LIST ----- */
        .referrals-list-section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .referrals-list-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .referrals-list-section .section-header h3 {
            font-size: 18px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .referrals-list-section .section-header h3 i {
            color: var(--primary-light);
        }

        .referrals-list-section .section-header .badge-count {
            background: rgba(42, 111, 111, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        /* ----- EMPTY STATE ----- */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            color: var(--primary-light);
            opacity: 0.3;
            margin-bottom: 16px;
        }

        .empty-state h4 {
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ----- LOADING ----- */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 12px;
            color: var(--text-muted);
        }

        .loading-spinner i {
            font-size: 28px;
            color: var(--primary-light);
            animation: spin 1s linear infinite;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 1024px) {
            .main-content {
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 16px;
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header .title-section h2 {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .stat-card .stat-number {
                font-size: 28px;
            }

            .referral-link-box {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
            }

            .referral-link-box input {
                padding: 8px 12px;
                font-size: 13px;
                text-align: center;
            }

            .referral-link-box .btn-copy {
                justify-content: center;
            }

            .send-email-section .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .send-email-section .form-row .input-wrapper {
                min-width: unset;
            }

            .send-email-section .form-row .btn-send {
                justify-content: center;
            }

            .share-buttons {
                justify-content: center;
            }

            .share-buttons .btn-share {
                flex: 1;
                justify-content: center;
                min-width: 80px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
            }

            .page-header .title-section h2 {
                font-size: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .referral-section .section-header {
                flex-direction: column;
                align-items: stretch;
            }

            .share-buttons .btn-share {
                font-size: 12px;
                padding: 8px 14px;
            }
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
    </style>
</head>
<body>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

        <!-- Message Area -->
        <div id="messageArea" class="message-area"></div>

        <!-- Page Header -->
        <header class="page-header">
            <div class="title-section">
                <h2><i class="fas fa-user-friends"></i></h2>
                <p>Invite friends and earn rewards for every successful referral</p>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-shine"></div>
                <div class="stat-header">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                </div>
                <div class="stat-number" id="totalReferrals">Loading...</div>
                <div class="stat-label">Total Referrals</div>
            </div>
            <div class="stat-card">
                <div class="stat-shine"></div>
                <div class="stat-header">
                    <div class="stat-icon"><i class="fas fa-coins"></i></div>
                </div>
                <div class="stat-number" id="connectsAwarded">Loading...</div>
                <div class="stat-label">Connects Awarded</div>
            </div>
        </div>

        <!-- Referral Link Section -->
        <div class="referral-section">
            <div class="section-header">
                <h3><i class="fas fa-link"></i> Your Referral Link</h3>
                <span style="font-size: 13px; color: var(--text-muted);">
                    <i class="fas fa-users"></i> Share and earn rewards
                </span>
            </div>

            <div class="referral-link-box">
                <input 
                    type="text" 
                    id="referralLinkInput" 
                    readonly 
                    value="{{ refferal_link }}"
                />
                <button class="btn-copy" id="copyBtn">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>

            <!-- Send Email Section -->
            <div class="send-email-section">
                <form id="sendEmailForm">
                    <div class="form-row">
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input 
                                type="email" 
                                id="emailInput" 
                                placeholder="Enter friend's email address..." 
                                required
                                autocomplete="email"
                            />
                        </div>
                        <button type="submit" class="btn-send" id="sendEmailBtn">
                            <i class="fas fa-spinner spinner"></i>
                            <i class="fas fa-paper-plane"></i>
                            <span class="btn-text">Send Invite</span>
                        </button>
                    </div>
                </form>
            </div>

            <div class="share-buttons">
                <button class="btn-share whatsapp" id="shareWhatsApp">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </button>
                <button class="btn-share twitter" id="shareTwitter">
                    <i class="fab fa-twitter"></i> Twitter
                </button>
                <button class="btn-share linkedin" id="shareLinkedIn">
                    <i class="fab fa-linkedin-in"></i> LinkedIn
                </button>
                <button class="btn-share facebook" id="shareFacebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
            </div>
        </div>

        <!-- Referrals List -->
        <div class="referrals-list-section">
            <div class="section-header">
                <h3><i class="fas fa-list"></i> Referral History</h3>
                <span class="badge-count" id="referralCount">0</span>
            </div>
            <div id="referralsContainer">
                <div class="loading-spinner">
                    <i class="fas fa-spinner"></i>
                    <span>Loading referrals...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            "use strict";

            // ----- DOM REFERENCES -----
            const totalReferralsEl = document.getElementById('totalReferrals');
            const connectsAwardedEl = document.getElementById('connectsAwarded');
            const referralLinkInput = document.getElementById('referralLinkInput');
            const copyBtn = document.getElementById('copyBtn');
            const referralsContainer = document.getElementById('referralsContainer');
            const referralCount = document.getElementById('referralCount');
            const messageArea = document.getElementById('messageArea');
            const sendEmailForm = document.getElementById('sendEmailForm');
            const emailInput = document.getElementById('emailInput');
            const sendEmailBtn = document.getElementById('sendEmailBtn');

            // ----- API ENDPOINTS -----
            const API = {
                connectsAwarded: '/connects_awarded_from/referrals',
                accountReferrals: '/account/referrals',
                referredClients: '/reffered/clients',
                sendReferralLink: '/send_refferal/link'
            };

            // ----- UTILITY FUNCTIONS -----
            function showMessage(message, type = 'info') {
                if (!messageArea) return;
                messageArea.textContent = message;
                messageArea.className = `message-area show ${type}`;
                clearTimeout(window.messageTimeout);
                window.messageTimeout = setTimeout(() => {
                    if (messageArea) messageArea.classList.remove('show');
                }, 5000);
            }

            function formatNumber(num) {
                if (num >= 1000) {
                    return (num / 1000).toFixed(1) + 'k';
                }
                return num.toString();
            }

            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            function formatDate(dateString) {
                if (!dateString) return 'Date not available';
                try {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                } catch {
                    return 'Date not available';
                }
            }

            // ----- LOAD CONNECTS AWARDED -----
            async function loadConnectsAwarded() {
                try {
                    const response = await fetch(API.connectsAwarded, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success) {
                        // The endpoint returns connects_from_refferals as a number (connects_from_referral column)
                        const connects = data.connects_from_refferals || 0;
                        connectsAwardedEl.textContent = formatNumber(connects);
                        return connects;
                    } else {
                        connectsAwardedEl.textContent = '0';
                        return 0;
                    }
                } catch (error) {
                    connectsAwardedEl.textContent = '0';
                    return 0;
                }
            }

            // ----- LOAD ACCOUNT REFERRALS (Total Count) -----
            async function loadAccountReferrals() {
                try {
                    const response = await fetch(API.accountReferrals, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success) {
                        const count = data.referrals || 0;
                        totalReferralsEl.textContent = formatNumber(count);
                        referralCount.textContent = count;
                        return count;
                    } else {
                        totalReferralsEl.textContent = '0';
                        referralCount.textContent = '0';
                        return 0;
                    }
                } catch (error) {
                    totalReferralsEl.textContent = '0';
                    referralCount.textContent = '0';
                    return 0;
                }
            }

            // ----- LOAD REFERRED CLIENTS (List) -----
            async function loadReferredClients() {
                try {
                    const response = await fetch(API.referredClients, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return;
                    }

                    if (data.success && data.reffered_clients) {
                        renderReferrals(data.reffered_clients);
                        return data.reffered_clients;
                    } else {
                        renderReferrals([]);
                        return [];
                    }
                } catch (error) {
                    renderReferrals([]);
                    return [];
                }
            }

            // ----- RENDER REFERRALS -----
            function renderReferrals(referredClients) {
                if (!referralsContainer) return;

                if (!referredClients || referredClients.length === 0) {
                    referralsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-user-plus"></i>
                            <h4>No referrals yet</h4>
                            <p>Share your referral link to start earning rewards!</p>
                        </div>
                    `;
                    return;
                }

                let html = `<div style="display: flex; flex-direction: column; gap: 12px;">`;
                referredClients.forEach((client) => {
                    const clientId = client.id || 'N/A';
                    const email = client.email || 'Email not available';
                    const date = formatDate(client.date_time);
                    
                    html += `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.5); border-radius: 12px; border: 1px solid var(--border);">
                            <div>
                                <div style="font-weight: 600; color: var(--text-dark);">
                                    <i class="fas fa-envelope" style="color: var(--primary-light);"></i> ${email}
                                </div>
                                <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                                    <i class="far fa-calendar-alt"></i> Joined: ${date}
                                </div>
                            </div>
                            <span style="font-size: 12px; color: var(--text-muted);">
                                #${clientId.substring(0, 8)}
                            </span>
                        </div>
                    `;
                });
                html += `</div>`;
                referralsContainer.innerHTML = html;
            }

            // ----- COPY REFERRAL LINK -----
            function copyReferralLink() {
                const link = referralLinkInput.value;
                if (!link || link === 'Loading referral link...' || link === '') {
                    showMessage('Referral link not available. Please refresh the page.', 'error');
                    return;
                }

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(link)
                        .then(() => {
                            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                            copyBtn.classList.add('copied');
                            showMessage('Referral link copied to clipboard!', 'success');
                            setTimeout(() => {
                                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                                copyBtn.classList.remove('copied');
                            }, 3000);
                        })
                        .catch(() => {
                            fallbackCopy(link);
                        });
                } else {
                    fallbackCopy(link);
                }
            }

            function fallbackCopy(text) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-9999px';
                textArea.style.top = '-9999px';
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    copyBtn.classList.add('copied');
                    showMessage('Referral link copied to clipboard!', 'success');
                    setTimeout(() => {
                        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                        copyBtn.classList.remove('copied');
                    }, 3000);
                } catch (err) {
                    showMessage('Failed to copy. Please select and copy the link manually.', 'error');
                }
                document.body.removeChild(textArea);
            }

            // ----- SEND REFERRAL LINK VIA EMAIL -----
            async function sendReferralLink(email) {
                if (!email || !validateEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    return false;
                }

                // Set loading state
                sendEmailBtn.classList.add('loading');
                sendEmailBtn.disabled = true;

                try {
                    const formData = new FormData();
                    formData.append('email', email);

                    const response = await fetch(API.sendReferralLink, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    const data = await response.json();

                    if (data.redirect) {
                        window.location.href = data.redirect;
                        return false;
                    }

                    if (data.success) {
                        showMessage(data.message || 'Referral link sent successfully!', 'success');
                        emailInput.value = '';
                        return true;
                    } else {
                        showMessage(data.message || 'Failed to send referral link.', 'error');
                        return false;
                    }
                } catch (error) {
                    showMessage('An error occurred. Please try again.', 'error');
                    return false;
                } finally {
                    sendEmailBtn.classList.remove('loading');
                    sendEmailBtn.disabled = false;
                }
            }

            // ----- SHARE FUNCTIONS -----
            function shareVia(platform) {
                const link = referralLinkInput.value;
                if (!link || link === 'Loading referral link...' || link === '') {
                    showMessage('Referral link not available. Please refresh the page.', 'error');
                    return;
                }

                const message = encodeURIComponent(
                    'Hey! 👋\n\nI\'m inviting you to join CraftLink — a professional network connecting skilled craftspeople with clients.\n\nUse my referral link to sign up:\n' + link
                );

                let shareUrl = '';
                switch (platform) {
                    case 'whatsapp':
                        shareUrl = `https://wa.me/?text=${message}`;
                        break;
                    case 'twitter':
                        shareUrl = `https://twitter.com/intent/tweet?text=${message}`;
                        break;
                    case 'linkedin':
                        shareUrl = `https://www.linkedin.com/sharing/share-offscreen/?url=${encodeURIComponent(link)}`;
                        break;
                    case 'facebook':
                        shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}&quote=${encodeURIComponent('Join me on CraftLink!')}`;
                        break;
                    default:
                        return;
                }

                if (shareUrl) {
                    window.open(shareUrl, '_blank', 'width=600,height=500');
                }
            }

            // ----- LOAD ALL DATA -----
            async function loadAllData() {
                // Show loading state for referrals
                referralsContainer.innerHTML = `
                    <div class="loading-spinner">
                        <i class="fas fa-spinner"></i>
                        <span>Loading referrals...</span>
                    </div>
                `;

                // Load all data in parallel
                await Promise.all([
                    loadConnectsAwarded(),
                    loadAccountReferrals(),
                    loadReferredClients()
                ]);
            }

            // ----- EVENT LISTENERS -----
            copyBtn.addEventListener('click', copyReferralLink);

            // Send email form
            sendEmailForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = emailInput.value.trim();
                await sendReferralLink(email);
            });

            // Share buttons
            document.getElementById('shareWhatsApp').addEventListener('click', () => shareVia('whatsapp'));
            document.getElementById('shareTwitter').addEventListener('click', () => shareVia('twitter'));
            document.getElementById('shareLinkedIn').addEventListener('click', () => shareVia('linkedin'));
            document.getElementById('shareFacebook').addEventListener('click', () => shareVia('facebook'));

            // Enter key on email input submits form
            emailInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendEmailForm.dispatchEvent(new Event('submit'));
                }
            });

            // Select all on click for referral link
            referralLinkInput.addEventListener('click', function() {
                this.select();
            });

            // ----- INIT -----
            loadAllData();

            // Auto-refresh stats every 60 seconds
            setInterval(() => {
                loadConnectsAwarded();
                loadAccountReferrals();
                loadReferredClients();
            }, 60000);

        })();
    </script>

</body>
</html>
